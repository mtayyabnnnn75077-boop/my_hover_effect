    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Image Hover Effect</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f4f4;
}

.card{
    width:350px;
    height:450px;
    position:relative;
    overflow:hidden;
    border-radius:20px;
    cursor:pointer;
    box-shadow:0 15px 35px rgba(0,0,0,.2);
}

.card img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.6s ease;
}

.overlay{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,.2));
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:30px;
    color:#fff;
    opacity:0;
    transition:.5s ease;
}

.overlay h2{
    font-size:32px;
    transform:translateY(30px);
    transition:.5s;
}

.overlay p{
    margin:15px 0;
    transform:translateY(30px);
    transition:.6s;
}

.overlay a{
    width:140px;
    text-align:center;
    text-decoration:none;
    background:#fff;
    color:#000;
    padding:12px 20px;
    border-radius:30px;
    font-weight:bold;
    transform:translateY(30px);
    transition:.7s;
}

.card:hover img{
    transform:scale(1.15) rotate(3deg);
}

.card:hover .overlay{
    opacity:1;
}

.card:hover .overlay h2,
.card:hover .overlay p,
.card:hover .overlay a{
    transform:translateY(0);
}
</style>
<body>

<div class="container">
    <div class="card">
        <img src="bluecortdp.jpg" alt="Nature">

        <div class="overlay">
            <h2>Image Hover</h2>
            <p>Discover amazing landscapes.</p>
            <a href="#">Explore</a>
        </div>
    </div>
</div>


</body>
</html>
    
</body>
</html>
